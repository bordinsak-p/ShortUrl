quarkus.datasource.db-kind=sqlite
sqlite.datasource.file-path=database.db
quarkus.datasource.jdbc.url=jdbc:sqlite:${sqlite.datasource.file-path}?journal_mode=WAL&synchronous=NORMAL
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true

quarkus.console.color=true